<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bgGrad)" rx="12" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="900" height="240" fill="url(#grid)" rx="12" />

  <!-- Animated Glowing Orbs -->
  <circle cx="150" cy="80" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="150;210;150" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;120;80" dur="10s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="750" cy="160" r="120" fill="#8b5cf6" opacity="0.1" filter="url(#glow)">
    <animate attributeName="cx" values="750;690;750" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="160;110;160" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Top & Bottom Accent Lines -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accentGrad)" />
  <rect x="0" y="237" width="900" height="3" fill="url(#accentGrad)" />

  <!-- Wave Beam Animation -->
  <path d="M-200,120 Q 150,40 450,120 T 1100,120" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="-200,0; 200,0; -200,0" dur="14s" repeatCount="indefinite" />
  </path>

  <!-- Status Badge -->
  <g transform="translate(60, 42)">
    <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">OPEN FOR PROJECTS</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="112" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Athallah Fatha <tspan fill="url(#accentGrad)">(Gagah)</tspan>
  </text>

  <!-- Subtitle Roles -->
  <text x="60" y="148" font-family="'Segoe UI', Ubuntu, Roboto, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Business Analyst  <tspan fill="#38bdf8">•</tspan>  Supply Chain Analyst  <tspan fill="#38bdf8">•</tspan>  Fullstack Developer
  </text>

  <!-- Animated Monospace Line -->
  <g transform="translate(60, 184)">
    <text x="0" y="0" font-family="Consolas, 'Fira Code', monospace" font-size="13" fill="#64748b">&gt;</text>
    <text x="16" y="0" font-family="Consolas, 'Fira Code', monospace" font-size="13" fill="#38bdf8">
      building data-driven web apps &amp; optimizing business processes
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
    </text>
    <rect x="525" y="-11" width="8" height="14" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
